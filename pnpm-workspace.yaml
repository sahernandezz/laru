packages:
  - packages/*
  - apps/*

# Patched versions of transitive dependencies with known advisories (pnpm audit): Excalidraw's nanoid, lodash-es
# and katex, and the MCP SDK's body-parser. Drop a line once its parent ships the fix itself.
overrides:
  "nanoid@<3.3.18": "^3.3.18"
  "nanoid@>=4.0.0 <5.1.16": "^5.1.16"
  "lodash-es@<4.18.0": "^4.18.1"
  "katex@<0.18.2": "^0.18.2"
  "body-parser@<2.4.0": "^2.4.0"
